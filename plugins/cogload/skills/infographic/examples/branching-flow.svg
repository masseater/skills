<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 560" width="1060" height="560" role="img" aria-label="プラグインは、文章を書かせる処理を claude -p に、選ばせる処理を判断モデルに任せ、判断モデルが失敗したときは元の文章を表示する。" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans',sans-serif">
<style>svg{--bg:#ffffff;--ink:#1f2933;--sub:#5b6672;--line:#c7d0d9;--mix:0.17;--person:#2151af;--personF:#d9e1f1;--system:#966cd7;--systemF:#ede6f8;--data:#179a8e;--dataF:#d8eeec;--money:#d16022;--moneyF:#f7e4d9;--decision:#942464;--decisionF:#eddae5;--outside:#6b7785;--outsideF:#f2f3f5;--good:#1a7f37;--goodF:#d8e9dd;--caution:#9a6700;--cautionF:#eee5d4;--fail:#cf222e;--failF:#f7d9db}@media (prefers-color-scheme:dark){svg{--bg:#14181c;--ink:#e8ecef;--sub:#a3adb8;--line:#3a444e;--mix:0.27;--person:#3769ca;--personF:#1d2e4b;--system:#ae84f2;--systemF:#3e3556;--data:#2da79b;--dataF:#1b3f3e;--money:#ed7940;--moneyF:#4f3226;--decision:#af3e7c;--decisionF:#3e2236;--outside:#8d99a6;--outsideF:#24292f;--good:#3fb950;--goodF:#20432a;--caution:#d29922;--cautionF:#473b1e;--fail:#f85149;--failF:#522728}}
.bg{fill:var(--bg)}.t{fill:var(--ink)}.s{fill:var(--sub)}.n{fill:var(--f);stroke:var(--s);stroke-width:2;stroke-linejoin:round}.o{stroke-dasharray:6 5}
.k-person{--s:var(--person);--f:var(--personF)}.k-system{--s:var(--system);--f:var(--systemF)}.k-data{--s:var(--data);--f:var(--dataF)}.k-money{--s:var(--money);--f:var(--moneyF)}.k-decision{--s:var(--decision);--f:var(--decisionF)}.k-outside{--s:var(--outside);--f:var(--outsideF)}.k-good{--s:var(--good);--f:var(--goodF)}.k-caution{--s:var(--caution);--f:var(--cautionF)}.k-fail{--s:var(--fail);--f:var(--failF)}.ln{stroke:var(--sub);stroke-width:2;fill:none}.cn{stroke:var(--decision);stroke-width:2;fill:none;stroke-dasharray:7 6}
.halo{paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}
.g{fill:none;stroke:var(--s);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.gf{fill:var(--f);stroke:var(--s);stroke-width:2}.gs{fill:var(--s)}</style>
