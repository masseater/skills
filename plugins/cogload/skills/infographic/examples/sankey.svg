<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" width="1180" height="490" role="img" aria-label="1 日に書き込む約 1,480 万行のうち、約 1,000 万行は message、約 480 万行はほかの表が占める。約 170 万行は含まれる分で、約 1,310 万行が課金され、約 $13/日になる。" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans',sans-serif">
