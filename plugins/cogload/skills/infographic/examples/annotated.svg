<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" role="img" aria-label="GitBook 風のページの各部：開閉ボタン、サイドバー、パンくず、本文、このページの目次、前後のページへのリンク。" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans',sans-serif">
