163.7Q185.7 390 206.7 383.4L940 153.7" style="fill:none;stroke:var(--money);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round"/><circle cx="940" cy="153.7" r="8" style="fill:var(--money);stroke:var(--bg);stroke-width:3"/><text x="948" y="119.66" font-size="24" text-anchor="end" dominant-baseline="central" font-weight="700" class="t halo">500 サーバーで約 $13/日</text><circle cx="185.7" cy="390" r="6" style="fill:var(--money);stroke:var(--bg);stroke-width:3"/><text x="100" y="315.2" font-size="16" text-anchor="start" dominant-baseline="central" font-weight="400" class="t"><tspan x="100" dy="0">約 56 サーバーまでは</tspan><tspan x="100" dy="21.6">含まれる範囲に収まる</tspan></text>
