<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 570" width="1060" height="570" role="img" aria-label="スキルの変更は、編集し、検証し、PR を出して squash マージし、次のブランチを main から作り直す流れで進む。" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans',sans-serif">
