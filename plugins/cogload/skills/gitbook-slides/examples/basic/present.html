<section>
<h2>発表するときと配るとき</h2>
<table>
<tr><th>場面</th><th>操作</th></tr>
<tr><td>発表する</td><td>右上の再生ボタンで、スライドだけを全画面に出す。<br>← → で送り、Esc で戻る</td></tr>
<tr><td>読み物として渡す</td><td>Artifact のリンクを渡す。<br>スライドの番号が URL の <code>#3</code> に入る</td></tr>
<tr><td>PDF で渡す</td><td><code>--pdf</code> で書き出したファイルを添付する</td></tr>
</table>
<aside class="notes">
<p>同じファイルで、発表にも読み物にも PDF にも使えます。スピーカーノートは発表の画面と PDF には出ません。</p>
</aside>
</section>
