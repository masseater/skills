<section>
<h2>デッキのフォルダに置くもの</h2>
<table>
<tr><th>ファイル</th><th>中身</th></tr>
<tr><td><code>SUMMARY.md</code></td><td>スライドの順序と、左の一覧のグループ</td></tr>
<tr><td><code>&lt;id&gt;.html</code></td><td>1 枚分の中身と、<code>aside.notes</code> のスピーカーノート</td></tr>
<tr><td><code>deck.css</code></td><td>全スライドに効く見た目</td></tr>
<tr><td>画像</td><td>スライドから相対パスで参照し、HTML に埋め込まれる</td></tr>
</table>
<aside class="notes">
<p>用意するのは表の 4 種類だけです。SUMMARY.md の見出しが左の一覧のグループになり、リストの順がスライドの順になります。</p>
<p>画像はビルドのときに HTML の中へ埋め込むので、出来上がるのは 1 つのファイルだけです。</p>
</aside>
</section>
