name: up-to-date

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

env:
  TAKUMI_GUARD_TOKEN: ${{ secrets.TAKUMI_GUARD_TOKEN }}

jobs:
  up-to-date:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: lockfile
        if: github.event_name == 'pull_request'
        uses: masseater/typescript-template/.github/actions/pr-changed@d9de249aed55a920f53ecb21da13550867ee15b5
        with:
          file: pnpm-lock.yaml
          github-token: ${{ github.token }}
      - if: steps.lockfile.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.lockfile.outputs.changed == 'true' && env.TAKUMI_GUARD_TOKEN != ''
        env:
          TOKEN: ${{ env.TAKUMI_GUARD_TOKEN }}
        run: printf '//npm.flatt.tech/:_authToken=%s\n' "$TOKEN" >> "$HOME/.npmrc"
      - if: steps.lockfile.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: "false"
          run-install: |
            - args: ['--frozen-lockfile']
      - if: steps.lockfile.outputs.changed == 'true'
        run: vp exec pnpm store prune

  wake:
    needs: [up-to-date]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run update-branches.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
